name: Feature request
description: Suggest a new capability
labels: ["Type: Feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that jobship makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen? Note that jobship never submits forms or sends messages, and that will not change.
    validations:
      required: true
