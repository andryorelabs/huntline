name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 4200))
          while true; do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI passed")] | sort_by(.id) | last // empty') || run_json=''
            status=$(jq -r '.status // empty' <<< "${run_json}")
            conclusion=$(jq -r '.conclusion // empty' <<< "${run_json}")
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "CI passed concluded success for ${GITHUB_SHA}"
                exit 0
              fi
              echo "CI passed concluded ${conclusion} for ${GITHUB_SHA}. Re-run the failed CI job on main, then re-run this workflow."
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              if [[ -z "${status}" ]]; then
                echo "No CI passed check run found for ${GITHUB_SHA} after 70 minutes"
              else
                echo "CI passed is still ${status} for ${GITHUB_SHA} after 70 minutes"
              fi
              exit 1
            fi
            echo "CI passed is ${status:-missing}, checking again in 30s"
            sleep 30
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches plugin.json
        run: |
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ "${GITHUB_REF_NAME}" != "v${plugin_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version v${plugin_version}"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile

      # Fails, before anything is built, when CHANGELOG.md has no section for the tag or it is empty.
      - name: Take the release notes from CHANGELOG.md
        run: bun tools/release/changelog-section.ts "${GITHUB_REF_NAME}" > release-notes.md

      - name: Build the standalone binaries
        run: bun tools/build-binaries.ts --outdir dist

      - name: Smoke-run the linux binary
        run: ./dist/jobship-linux-x64 --version

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum jobship-linux-x64 jobship-linux-arm64 jobship-darwin-x64 jobship-darwin-arm64 > SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/jobship-linux-x64
            dist/jobship-linux-arm64
            dist/jobship-darwin-x64
            dist/jobship-darwin-arm64
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, nothing to publish"
            exit 0
          fi
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          cp "${PROVENANCE_BUNDLE_PATH}" dist/jobship.intoto.jsonl
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/jobship-linux-x64 \
            dist/jobship-linux-arm64 \
            dist/jobship-darwin-x64 \
            dist/jobship-darwin-arm64 \
            dist/SHA256SUMS \
            dist/jobship.intoto.jsonl
